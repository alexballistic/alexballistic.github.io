name: update-manifests

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/build.py
      - name: commit manifests if changed
        run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add data/ content/banners.json
          git diff --cached --quiet || git commit -m "auto-update gallery manifests"
          git push
